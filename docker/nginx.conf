server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;          # ওয়েবসার্ভারের মূল ডিরেক্টরি
        index index.html;                     # ডিফল্ট পেজ হিসেবে index.html দেখাবে
        try_files $uri $uri/ =404;           # যদি রিকোয়েস্ট করা ফাইল/ফোল্ডার না পাওয়া যায়, 404 রিটার্ন করবে
    }

    error_page 404 /404.html;                 # 404 error হলে /404.html পেজ দেখাবে
}
