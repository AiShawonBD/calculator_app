name: Docker CI/CD

on:
  push:
    branches:
      - main   # run on push to main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: aishawon/calculator-app

    steps:
    # 1️⃣ Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2️⃣ Set image tag (BUILD_NUMBER equivalent)
    - name: Set image tag
      id: vars
      run: |
        SHORT_COMMIT=$(git rev-parse --short HEAD)
        echo "IMAGE_TAG=${IMAGE_NAME}:${GITHUB_RUN_NUMBER}-${SHORT_COMMIT}" >> $GITHUB_ENV

    # 3️⃣ Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 4️⃣ Build Docker image
    - name: Build Docker image
      run: |
        docker build -t $IMAGE_TAG -f docker/Dockerfile .
        docker image ls

    # 5️⃣ Push Docker image
    - name: Push Docker image
      run: |
        docker push $IMAGE_TAG

    # 6️⃣ Optionally push "latest" tag
    - name: Tag and push latest
      run: |
        docker tag $IMAGE_TAG $IMAGE_NAME:latest
        docker push $IMAGE_NAME:latest

     # 7️⃣ Build success notification
    - name: Build Successful
      run: |
        echo "🎉 Docker image build and push completed successfully! 🎉"